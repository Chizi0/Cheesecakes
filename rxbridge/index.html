<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RxBridge | Medication Journey Demo</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#16233a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#163b67;color:white;padding:24px max(20px,calc((100vw - 900px)/2))}header h1{margin:0;font-size:2rem}header p{margin:6px 0 0}main{max-width:900px;margin:auto;padding:24px 16px}.notice{background:#fff3d5;border:1px solid #e4c477;border-radius:10px;padding:12px;margin-bottom:20px}.toolbar,.card{background:white;border:1px solid #e0e5ee;border-radius:14px;padding:20px;margin-bottom:16px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #aab7c8}button{background:#163b67;color:white;cursor:pointer}button:disabled{background:#aab7c8;cursor:not-allowed}.muted{color:#536176}.tag{display:inline-block;background:#e7eff9;border-radius:99px;padding:5px 12px;font-weight:600}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}h2{margin:0 0 8px}h3{margin:0 0 12px}.timeline{margin:16px 0;padding-left:20px}.timeline li{margin:7px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.empty{padding:25px;text-align:center;color:#536176}
</style></head><body><header><h1>RxBridge</h1><p>From prescription to pickup.</p></header><main><div class="notice"><strong>Demo only.</strong> Fictional patients and prescriptions. No real prescribing, pharmacy connections, or medical guidance.</div><div class="toolbar"><label for="role"><strong>View as</strong></label><select id="role"><option value="patient">Patient</option><option value="pharmacy">Pharmacy</option><option value="prescriber">Prescriber</option></select><button id="reset">Reset demo</button></div><div id="content" aria-live="polite"></div></main>
<script>
const initial=[{id:"RX-1001",patient:"Jordan Lee",medication:"Demo Medication A",pharmacy:"Main Street Pharmacy",status:"processing",history:[["received","Prescription received"],["processing","Pharmacy started processing"]]},{id:"RX-1002",patient:"Taylor Morgan",medication:"Demo Medication B",pharmacy:"Central Pharmacy",status:"delayed",history:[["received","Prescription received"],["delayed","Pharmacy reported a fulfillment delay"]]}];
let orders=structuredClone(initial);
const transitions={received:["processing","delayed"],processing:["ready","delayed"],delayed:["processing"],ready:["picked up"],"picked up":[]};
const labels={received:"Received",processing:"Processing",delayed:"Delayed",ready:"Ready for pickup","picked up":"Picked up"};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){const role=document.getElementById("role").value;document.getElementById("content").innerHTML='<h2>'+({patient:"Your prescriptions",pharmacy:"Pharmacy queue",prescriber:"Prescriber overview"}[role])+'</h2>'+orders.map(o=>'<section class="card"><div class="row"><h3>'+escapeHtml(o.id)+' · '+escapeHtml(o.medication)+'</h3><span class="tag">'+labels[o.status]+'</span></div><p class="muted">Patient: '+escapeHtml(o.patient)+' · '+escapeHtml(o.pharmacy)+'</p><strong>Journey</strong><ol class="timeline">'+o.history.map(h=>'<li>'+escapeHtml(h[1])+'</li>').join('')+'</ol>'+(role==="pharmacy"?'<div class="actions">'+transitions[o.status].map(s=>'<button data-id="'+o.id+'" data-status="'+s+'">Mark '+labels[s]+'</button>').join('')+'</div>':'<p class="muted">'+(role==="patient"?"Check here for updates from your pharmacy.":"Read-only visibility into the simulated prescription journey.")+'</p>')+'</section>').join('');document.querySelectorAll("button[data-id]").forEach(b=>b.addEventListener("click",()=>{const o=orders.find(x=>x.id===b.dataset.id);const next=b.dataset.status;if(!o||!transitions[o.status].includes(next))return;o.status=next;o.history.push([next,next==="delayed"?"Pharmacy reported a fulfillment delay":"Status updated to "+labels[next]]);render()}))}
document.getElementById("role").addEventListener("change",render);document.getElementById("reset").addEventListener("click",()=>{orders=structuredClone(initial);render()});render();
</script></body></html>
