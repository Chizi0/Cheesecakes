<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIALA — closet availability</title></head><body>
<div id="ziala-closet">
<style>
#ziala-closet{color-scheme:light dark;font-family:system-ui,sans-serif;background:light-dark(#f5eef0,#261a20);color:light-dark(#512a38,#f1dce5);padding:24px;border-radius:16px}#ziala-closet *{box-sizing:border-box}#ziala-closet h2{font-size:25px;margin:8px 0 16px}#ziala-closet h3{font-size:17px;margin:8px 0}#ziala-closet .zc-kicker{font-size:12px;letter-spacing:.14em}#ziala-closet .zc-muted{font-size:13px;color:light-dark(#775c65,#d4b8c4)}#ziala-closet p{line-height:1.6}#ziala-closet .zc-panel{padding:18px;border-radius:12px;background:light-dark(#fff,#38232c);border:1px solid light-dark(#decbd2,#76505f);margin:14px 0}#ziala-closet .zc-item{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 0;border-top:1px solid light-dark(#eadce1,#674552)}#ziala-closet .zc-item p{margin:6px 0}#ziala-closet button{font:inherit;min-height:44px;padding:10px 14px;border:1px solid light-dark(#b690a0,#ad7d90);border-radius:7px;background:light-dark(#f7ebf0,#50313e);color:inherit}#ziala-closet .zc-snooze{display:grid;gap:8px;margin:14px 0;font-size:13px}#ziala-closet input{font:inherit;font-size:16px;min-height:44px;max-width:100%;padding:10px;border-radius:6px;background:light-dark(#fff,#38232c);color:inherit;border:1px solid light-dark(#b690a0,#ad7d90)}#ziala-closet [hidden]{display:none}@media(max-width:420px){#ziala-closet{padding:14px}}
</style>
<p class="zc-kicker">ZIALA / YOUR CLOSET</p>
<h2>A little closet check-in</h2>
<p class="zc-muted">Demo clock (local): <span data-role="clock"></span></p><button type="button" data-role="advance">Advance demo 30 minutes</button>
<p data-role="counts" class="zc-muted" aria-live="polite"></p>
<section data-role="reminders" aria-label="Laundry reminders" aria-live="polite"></section>
<div data-role="items" class="zc-panel"></div>
<button type="button" data-role="reset">Reset sample closet</button>
<p data-role="message" role="status" aria-live="polite"></p>
<p class="zc-muted">Sample wardrobe · Status changes stay in this preview · Snoozes use the demo clock; refresh clears them · No notification is sent</p>
</div>
<script type="module" src="closet.mjs"></script>
</body></html>
