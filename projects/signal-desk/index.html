<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Desk — ticket card</title></head><body>
<div id="signal-desk-card">
<style>
#signal-desk-card{color-scheme:light dark;font-family:system-ui,sans-serif;color:light-dark(#243247,#e6eaf2);padding:24px;background:light-dark(#eef2f7,#121923);border-radius:18px}#signal-desk-card *{box-sizing:border-box}#signal-desk-card .sd-brand{letter-spacing:.12em;font-size:12px;margin:0 0 20px}#signal-desk-card article{background:light-dark(#fff,#1e2938);padding:24px;border:1px solid light-dark(#d6dfeb,#40506a);border-radius:12px}#signal-desk-card .sd-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}#signal-desk-card .sd-badge{padding:6px 10px;border-radius:6px;font-size:13px;background:light-dark(#fbe5e4,#562b32);color:light-dark(#8f2427,#ffc6c8)}#signal-desk-card .sd-badge[data-priority="High"]{background:light-dark(#fff0d1,#4c3d22);color:light-dark(#805214,#ffdda1)}#signal-desk-card h2{font-size:23px;line-height:1.3;margin:20px 0 10px}#signal-desk-card p{line-height:1.6}#signal-desk-card .sd-secondary{color:light-dark(#526278,#b4c0d2);font-size:13px}#signal-desk-card .sd-controls{display:flex;flex-wrap:wrap;gap:18px;margin:22px 0}#signal-desk-card label{display:grid;gap:8px;font-size:13px;flex:1;min-width:180px}#signal-desk-card input,#signal-desk-card select{font:inherit;font-size:16px;width:100%;min-height:44px;padding:10px;border:1px solid light-dark(#aab8cb,#65748b);border-radius:7px;color:inherit;background:light-dark(#fff,#1e2938)}#signal-desk-card .sd-label{font-size:12px;letter-spacing:.07em;margin:20px 0 6px}#signal-desk-card .sd-action{font-weight:600;margin-top:0}#signal-desk-card [hidden]{display:none}#signal-desk-card .sd-error{color:light-dark(#a82424,#ffb4b4)}@media(max-width:420px){#signal-desk-card{padding:14px}#signal-desk-card article{padding:18px}}
</style>
<p class="sd-brand">SIGNAL DESK / CHECKOUT TRIAGE</p>
<article aria-label="Checkout failure ticket">
<div class="sd-top"><span class="sd-secondary">TICKET SD-1042 · Sample data</span><span class="sd-badge" data-role="priority">Critical</span><span class="sd-secondary" data-role="triage">Needs triage</span></div>
<h2>Customers cannot complete checkout</h2>
<div class="sd-controls"><label>Customers affected<input data-role="count" type="number" value="12" min="1" step="1" required></label><label>Payment link status<select data-role="workaround"><option value="unknown">Unknown</option><option value="working">Confirmed working</option><option value="unavailable">Confirmed unavailable</option></select></label></div>
<div data-role="result" aria-live="polite"><p class="sd-label">WHY THIS PRIORITY</p><p data-role="explanation"></p><div data-role="action-block"><p class="sd-label">NEXT ACTION</p><p class="sd-action" data-role="action">Check status of payment link</p></div></div>
<p data-role="error" role="alert" class="sd-error" hidden></p>
</article>
<p class="sd-secondary">Rule-based suggestion · Changes stay in this preview · No live customer data</p>
</div>
<script type="module" src="card.mjs"></script>
</body></html>
