<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldwork — technician dispatch</title></head><body>
<div id="fw-dispatch">
<style>
#fw-dispatch{color-scheme:light dark;font-family:system-ui,sans-serif;padding:24px;background:light-dark(#eef2f7,#141d29);color:light-dark(#223349,#e0e9f5);border-radius:16px}#fw-dispatch *{box-sizing:border-box}#fw-dispatch article{padding:22px;background:light-dark(#fff,#223046);border:1px solid light-dark(#ccd7e5,#4c607c);border-radius:12px}#fw-dispatch h2{margin:10px 0;font-size:24px}#fw-dispatch p{line-height:1.6}#fw-dispatch .fw-kicker{font-size:12px;letter-spacing:.1em}#fw-dispatch .fw-muted{font-size:13px;color:light-dark(#52657c,#b9c9de)}#fw-dispatch .fw-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}#fw-dispatch button{font:inherit;min-height:44px;padding:10px 14px;border-radius:7px;border:1px solid light-dark(#a2b3c9,#6b85a7);background:light-dark(#edf3fa,#2a405c);color:inherit}#fw-dispatch button:disabled{opacity:.5}#fw-dispatch .fw-primary{background:light-dark(#284c77,#bbd7fc);color:light-dark(#fff,#142943)}#fw-dispatch .fw-tech{padding:16px 0;border-top:1px solid light-dark(#dce4ef,#435671)}#fw-dispatch .fw-tech p{margin:6px 0}#fw-dispatch label{display:flex;gap:10px;align-items:center;min-height:44px}#fw-dispatch input{width:20px;height:20px}#fw-dispatch .fw-notice{font-weight:600;min-height:28px}#fw-dispatch [hidden]{display:none}@media(max-width:420px){#fw-dispatch{padding:14px}#fw-dispatch article{padding:16px}}
</style>
<p class="fw-kicker">FIELDWORK / SAMPLE DISPATCH</p>
<article aria-label="Technician dispatch demonstration">
<h2 data-role="job-title">JOB-01 · Electrical repair</h2>
<p>Required certification: <strong>electrical</strong></p>
<p data-role="job-status" aria-live="polite"></p>
<div data-role="roster"></div>
<div class="fw-row"><button type="button" class="fw-primary" data-role="dispatch">Dispatch job</button><button type="button" data-role="advance" hidden>Advance job</button><button type="button" data-role="next-job" hidden>Create next sample job</button><button type="button" data-role="reset">Reset sample</button></div>
<p data-role="notice" class="fw-notice" role="status" aria-live="polite"></p>
</article>
<p class="fw-muted">Synthetic records and travel estimates · Availability confirmations are simulated on behalf of each technician · No external messages</p>
</div>
<script type="module" src="card.mjs"></script>
</body></html>
